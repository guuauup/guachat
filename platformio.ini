; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================
; guachat_dev — AI 开发基线
;
; 只编译 BSP（src/bsp）、开发界面（src/dev）和它们依赖的驱动。
; ============================================================
[env:guachat_dev]
platform = espressif32 @ 6.5.0
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
build_flags =
	-DUSER_SETUP_LOADED=1
	-I lib/TFT_eSPI
	-I lib/lvgl
	-I lib
	-include my_user_setup.h
	-I src/gps
	-I src/storage
	-I src/I2C0
	-I src/I2S
	-I src/SX1280
	; 这些是应用层宏；框架 sdkconfig.h 仍定义 CONFIG_BT_ENABLED=1。
	; 基线只是不初始化蓝牙。启用 BLE 见 docs/hardware/射频与合规.md。
	-DCONFIG_BT_ENABLED=0
	-DCONFIG_BTDM_CTRL_MODE_BTDM=0
	-DCONFIG_BT_BLUEDROID_ENABLED=0
	-DCONFIG_BT_NIMBLE_ENABLED=0
	-DARDUINO_BLUETOOTH_DISABLED=1
	-DCONFIG_SPIRAM_USE=1
	-DCONFIG_SPIRAM_MODE_OPI=1
	-DCONFIG_SPIRAM_SIZE=8388608
	-DCONFIG_SPIRAM_DMA_AVAILABLE=1
	-DCONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=16384
	-DCONFIG_FATFS_ALLOC_PREFER_SPIRAM=1
	-DCONFIG_FATFS_CACHE_SECTORS=16
	-DCONFIG_FATFS_API_ENCODING_UTF_8=1
	-DCONFIG_FATFS_LFN_HEAP=1
	-DCONFIG_FATFS_MAX_LFN=255
	-DCONFIG_TASK_WDT_TIMEOUT_S=15
	-DCONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0=1
	-DCONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU1=1
	; setup() 在 Arduino loopTask 上跑，显示 + LVGL 初始化需要更大栈
	-DARDUINO_LOOP_STACK_SIZE=20480
	; 大体积字符串字面量放 IROM，平衡 DROM
	-mtext-section-literals
	; 项目无 try/catch，关 C++ 异常省 DROM
	-fno-exceptions
	-Wl,--print-memory-usage
	-Os
board_build.flash_mode = qio
board_build.partitions = partitions_16MB_app.csv
board_build.f_cpu = 240000000L
board_build.psram = enable
board_build.psram_mode = opi
board_build.psram_size = 8MB
board_build.flash_size = 16MB

; lvgl / TFT_eSPI / 部分驱动已固化在 lib/ 下，不要从注册表重新拉取。
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	robtillaart/TCA9555@^0.4.4
	adafruit/Adafruit QMC5883P Library@^1.0.2
	adafruit/Adafruit LSM6DS@^4.7.4
	sensirion/arduino-sht@^1.2.6
	adafruit/Adafruit BMP5xx Library@^1.0.2
	jgromes/RadioLib@^7.7.1
