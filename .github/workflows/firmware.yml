name: firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "skills/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "skills/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Restore PlatformIO cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Build
        run: pio run -e guachat_dev

      - name: Merge, verify, and archive
        run: |
          python tools/merge_firmware.py --no-build --zip
          python tools/archive_firmware.py create --env guachat_dev

      - name: Upload firmware and debug archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guachat-dev-firmware
          path: |
            build/guachat-dev-full.bin
            build/guachat-dev-full.bin.sha256
            build/guachat-dev-full.manifest.json
            build/guachat-dev-full-restore.zip
            dist/firmware/**
          if-no-files-found: error
          retention-days: 14
