name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-and-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Static checks and host tests
        run: python tools/validate.py --static --host
